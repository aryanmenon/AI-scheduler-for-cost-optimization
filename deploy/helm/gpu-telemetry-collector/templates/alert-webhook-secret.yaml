{{- if .Values.alerting.webhookUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpu-telemetry-collector.fullname" . }}-alert-webhook
  labels:
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  # A Slack-compatible incoming webhook URL: treated as a credential (not
  # a plain ConfigMap value) since anyone holding it can post into that
  # channel. Consumed by every sidecar below via envFrom -- see each
  # service's main.py/server.py for the consecutive-failure alerting this
  # backs.
  ALERT_WEBHOOK_URL: {{ .Values.alerting.webhookUrl | quote }}
{{- end }}
