{{- if .Values.dashboard.enabled }}
{{- $secretName := printf "%s-dashboard-auth" (include "gpu-telemetry-collector.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := .Values.dashboard.authToken }}
{{- if not $token }}
  {{- if $existing }}
    {{- $token = index $existing.data "DASHBOARD_AUTH_TOKEN" | b64dec }}
  {{- else }}
    {{- $token = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
  annotations:
    # helm diff/upgrade must never regenerate this once it exists -- the
    # lookup above already preserves the value across upgrades, but this
    # also stops `helm template`/dry-run tooling from treating the
    # randomly-generated value as a real diff every time.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Checked with a constant-time comparison in server.py. Left unset in
  # values.yaml, this is auto-generated on first install and kept stable
  # across upgrades via the lookup above -- retrieve it with:
  #   kubectl -n {{ .Release.Namespace }} get secret {{ $secretName }} -o jsonpath='{.data.DASHBOARD_AUTH_TOKEN}' | base64 -d
  DASHBOARD_AUTH_TOKEN: {{ $token | quote }}
{{- end }}
