{{- if .Values.dcgmExporter.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "gpu-telemetry-collector.fullname" . }}-dcgm-exporter
  labels:
    app.kubernetes.io/name: dcgm-exporter
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "gpu-telemetry-collector.fullname" . }}-dcgm-exporter
      {{- with .Values.dcgmExporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dcgmExporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dcgm-exporter
          image: "{{ .Values.dcgmExporter.image.repository }}:{{ .Values.dcgmExporter.image.tag }}"
          imagePullPolicy: {{ .Values.dcgmExporter.image.pullPolicy }}
          env:
            # Attaches namespace/pod/container labels to every GPU sample by
            # reading the kubelet's local pod-resources socket below.
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
            # DCGM_EXPORTER_KUBERNETES alone silently fails to attach any
            # pod/namespace label on GKE specifically: it matches device
            # IDs from the kubelet's pod-resources API against its own GPU
            # list assuming UUID form (e.g. "GPU-a85a...") by default, but
            # GKE's device plugin reports device-name form instead (e.g.
            # "nvidia0") -- the mismatch means every sample comes back
            # unattributed, with no error logged anywhere. Found live
            # testing on GKE. An earlier version of this chart hardcoded
            # DCGM_EXPORTER_KUBERNETES_GPU_ID_TYPE=device-name
            # unconditionally to fix that -- which then broke attribution
            # the same silent way on a standard NVIDIA k8s-device-plugin
            # cluster (found live on vast.ai/k3s), since that setup reports
            # the UUID form dcgm-exporter already assumes by default, and
            # forcing device-name there makes the same ID-matching fail in
            # the opposite direction. This is genuinely cluster-dependent,
            # not a single "correct" value -- leave
            # dcgmExporter.kubernetesGpuIdType empty for the standard
            # device-plugin model (GKE/EKS/AKS all typically use this, but
            # verify per-cluster the same way this was found: check DCGM's
            # own /metrics output for a real pod=/namespace= label after
            # deploying), set it to "device-name" only for clusters
            # confirmed to need it like GKE.
            {{- if .Values.dcgmExporter.kubernetesGpuIdType }}
            - name: DCGM_EXPORTER_KUBERNETES_GPU_ID_TYPE
              value: {{ .Values.dcgmExporter.kubernetesGpuIdType | quote }}
            {{- end }}
            # Without this, DCGM self-reports its own container hostname
            # (== this DaemonSet pod's name, e.g. "...-d5gfj") as the
            # "Hostname" metric label -- which correlator.py in
            # telemetry-collector reads as the physical node identity. That
            # both displays wrong (a pod name, not a node name) and is
            # unstable: if this pod is ever recreated on the SAME node
            # (crash, restart, upgrade), it gets a new random suffix and
            # every downstream finding silently loses continuity for that
            # node. NVIDIA's own upstream dcgm-exporter DaemonSet template
            # wires this same NODE_NAME env var for the same reason.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # host /home/kubernetes/bin/nvidia (the NVIDIA driver
            # installer's output directory on a GKE COS node) mounts to
            # /usr/local/nvidia below, so the actual libraries land at
            # /usr/local/nvidia/lib64 -- not on the default linker search
            # path, so DCGM needs to be told where to find them.
            - name: LD_LIBRARY_PATH
              value: "/usr/local/nvidia/lib64"
          ports:
            - name: metrics
              containerPort: 9400
          securityContext:
            # Requesting nvidia.com/gpu (an earlier version of this chart's
            # approach) makes dcgm-exporter compete with real GPU workloads
            # for the same finite allocatable-per-node count -- on a
            # single-GPU node with an active workload pod, dcgm-exporter
            # then sits Pending forever ("Insufficient nvidia.com/gpu"),
            # found live testing on GKE. A monitoring daemon must have
            # driver/device access independent of what workloads have
            # claimed, so instead it gets direct host-level access (the
            # same approach NVIDIA's own GPU-Operator dcgm-exporter
            # deployments use) via the hostPath mounts below. That requires
            # privileged: true -- Kubernetes' device cgroup normally
            # restricts a container to only the specific /dev nodes granted
            # through the device-plugin resource-request path being
            # bypassed here, and hostPath alone does not lift that
            # restriction.
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: pod-gpu-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
            - name: dev
              mountPath: /dev
            - name: nvidia-install-dir-host
              mountPath: /usr/local/nvidia
      volumes:
        - name: pod-gpu-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
        - name: dev
          hostPath:
            path: /dev
        - name: nvidia-install-dir-host
          hostPath:
            path: /home/kubernetes/bin/nvidia
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu-telemetry-collector.fullname" . }}-dcgm-exporter
  labels:
    app.kubernetes.io/name: dcgm-exporter
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
spec:
  # Headless: this DaemonSet has one pod per GPU node. A normal ClusterIP
  # Service load-balances every connection to a single random backend pod,
  # so the collector (which resolves this name and scrapes each returned
  # address -- see metrics_client.resolve_targets) would otherwise only
  # ever reach one node per cycle, silently starving every other node of
  # most of its expected samples. clusterIP: None makes DNS return every
  # backing pod's IP as its own A record instead of one virtual IP.
  clusterIP: None
  selector:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 9400
      targetPort: 9400
{{- end }}
