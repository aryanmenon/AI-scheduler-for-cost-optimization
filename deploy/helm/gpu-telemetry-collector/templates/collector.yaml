apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-config
  labels:
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
data:
  DCGM_EXPORTER_URL: {{ include "gpu-telemetry-collector.dcgmExporterUrl" . | quote }}
  KUBE_STATE_METRICS_URL: "http://{{ include "gpu-telemetry-collector.fullname" . }}-kube-state-metrics:8080/metrics"
  TELEMETRY_SQLITE_PATH: "/data/telemetry.db"
  SCRAPE_INTERVAL_SECONDS: {{ .Values.collector.scrapeIntervalSeconds | quote }}
  HTTP_TIMEOUT_SECONDS: {{ .Values.collector.httpTimeoutSeconds | quote }}
  MAX_SCRAPE_RETRIES: {{ .Values.collector.maxScrapeRetries | quote }}
  TELEMETRY_RETENTION_HOURS: {{ .Values.collector.retentionHours | quote }}
  # Consumed by the ingestion sidecar below. RAW_TELEMETRY_SQLITE_PATH
  # intentionally points at the same file as TELEMETRY_SQLITE_PATH above --
  # the collector and ingestion containers reach it via different mounts
  # of the same PVC (see volumeMounts), one read-write, one read-only.
  RAW_TELEMETRY_SQLITE_PATH: "/data/raw/telemetry.db"
  NORMALIZED_SQLITE_PATH: "/data/normalized/normalized.db"
  INGESTION_POLL_INTERVAL_SECONDS: {{ .Values.ingestion.pollIntervalSeconds | quote }}
  SOURCE_SCRAPE_INTERVAL_SECONDS: {{ .Values.collector.scrapeIntervalSeconds | quote }}
  LOW_CONFIDENCE_COVERAGE_THRESHOLD: {{ .Values.ingestion.lowConfidenceCoverageThreshold | quote }}
  DAILY_ROLLUP_MIN_RECOMPUTE_INTERVAL_SECONDS: {{ .Values.ingestion.dailyRollupMinRecomputeIntervalSeconds | quote }}
  NORMALIZED_SAMPLES_RETENTION_HOURS: {{ .Values.ingestion.normalizedSamplesRetentionHours | quote }}
  ROLLUPS_RETENTION_HOURS: {{ .Values.ingestion.rollupsRetentionHours | quote }}
  # Consumed by the waste-detector sidecar below.
  FINDINGS_SQLITE_PATH: "/data/findings/findings.db"
  DETECTOR_POLL_INTERVAL_SECONDS: {{ .Values.wasteDetector.pollIntervalSeconds | quote }}
  MIN_COVERAGE_RATIO: {{ .Values.wasteDetector.minCoverageRatio | quote }}
  IDLE_THRESHOLD_PCT: {{ .Values.wasteDetector.idleThresholdPct | quote }}
  MIN_IDLE_STREAK_HOURS: {{ .Values.wasteDetector.minIdleStreakHours | quote }}
  OVER_PROVISION_THRESHOLD_PCT: {{ .Values.wasteDetector.overProvisionThresholdPct | quote }}
  OVER_PROVISION_MIN_OBSERVATION_HOURS: {{ .Values.wasteDetector.overProvisionMinObservationHours | quote }}
  FRAGMENTATION_THRESHOLD_PCT: {{ .Values.wasteDetector.fragmentationThresholdPct | quote }}
  FRAGMENTATION_MIN_UNDERUTILIZED_GPUS: {{ .Values.wasteDetector.fragmentationMinUnderutilizedGpus | quote }}
  FRAGMENTATION_MIN_STREAK_HOURS: {{ .Values.wasteDetector.fragmentationMinStreakHours | quote }}
  PATTERN_MIN_DAYS_OBSERVED: {{ .Values.wasteDetector.patternMinDaysObserved | quote }}
  PATTERN_IDLE_THRESHOLD_PCT: {{ .Values.wasteDetector.patternIdleThresholdPct | quote }}
  PATTERN_MIN_CONSISTENT_FRACTION: {{ .Values.wasteDetector.patternMinConsistentFraction | quote }}
  MULTI_GPU_TARGET_UTILIZATION_PCT: {{ .Values.wasteDetector.multiGpuTargetUtilizationPct | quote }}
  MULTI_GPU_MIN_STREAK_HOURS: {{ .Values.wasteDetector.multiGpuMinStreakHours | quote }}
  UNDERUTILIZED_TARGET_PCT: {{ .Values.wasteDetector.underutilizedTargetPct | quote }}
  UNDERUTILIZED_MIN_RUN_HOURS: {{ .Values.wasteDetector.underutilizedMinRunHours | quote }}
  FINDINGS_RETENTION_HOURS: {{ .Values.wasteDetector.findingsRetentionHours | quote }}
  # Consumed by the savings-estimator sidecar below.
  SAVINGS_SQLITE_PATH: "/data/savings/savings.db"
  ESTIMATOR_POLL_INTERVAL_SECONDS: {{ .Values.savingsEstimator.pollIntervalSeconds | quote }}
  MIN_FINDING_CONFIDENCE: {{ .Values.savingsEstimator.minFindingConfidence | quote }}
  SLA_TARGET_UTILIZATION_PCT: {{ .Values.savingsEstimator.slaTargetUtilizationPct | quote }}
  HOURS_PER_MONTH: {{ .Values.savingsEstimator.hoursPerMonth | quote }}
  FRAGMENTATION_CAPTURE_FRACTION: {{ .Values.savingsEstimator.fragmentationCaptureFraction | quote }}
  MULTI_GPU_CAPTURE_FRACTION: {{ .Values.savingsEstimator.multiGpuCaptureFraction | quote }}
  {{- if .Values.savingsEstimator.gpuHourlyRatesJson }}
  # Always prefer setting this to the customer's actual contracted rates
  # over the illustrative public list-price defaults baked into pricing.py.
  GPU_HOURLY_RATES_JSON: {{ .Values.savingsEstimator.gpuHourlyRatesJson | quote }}
  {{- end }}
  SAVINGS_ESTIMATES_RETENTION_HOURS: {{ .Values.savingsEstimator.savingsEstimatesRetentionHours | quote }}
  # Consumed by the dashboard sidecar below -- the self-serve sales artifact.
  # 0.0.0.0 is required here, not a leftover default: dashboard-service.yaml
  # is a real ClusterIP Service routing to this pod's actual network
  # interface, not to loopback, so binding to 127.0.0.1 would make the
  # Service unable to reach the container at all. DASHBOARD_AUTH_TOKEN
  # below (not the bind address) is what actually gates access.
  DASHBOARD_HOST: "0.0.0.0"
  DASHBOARD_PORT: {{ .Values.dashboard.port | quote }}
  TOP_FINDINGS_LIMIT: {{ .Values.dashboard.topFindingsLimit | quote }}
  DASHBOARD_RATE_LIMIT_MAX_REQUESTS: {{ .Values.dashboard.rateLimitMaxRequests | quote }}
  DASHBOARD_RATE_LIMIT_WINDOW_SECONDS: {{ .Values.dashboard.rateLimitWindowSeconds | quote }}
  # Consumed by all five sidecars: how many *consecutive* cycle/request
  # failures trigger a human-visible webhook alert (see
  # alert-webhook-secret.yaml for the URL itself, which is a credential
  # and lives in a Secret instead). Not sensitive on its own.
  ALERT_CONSECUTIVE_FAILURE_THRESHOLD: {{ .Values.alerting.consecutiveFailureThreshold | quote }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-data
  labels:
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-telemetry-collector.fullname" . }}-collector
  labels:
    app.kubernetes.io/name: telemetry-collector
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
spec:
  # Exactly one replica: the collector is a single writer to one SQLite
  # file, and a second replica would double-count every scrape. Ingestion
  # runs as a sidecar in the same pod (rather than its own Deployment) so
  # both can share one PVC without needing ReadWriteMany storage.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "gpu-telemetry-collector.fullname" . }}-collector
      {{- if .Values.persistence.enabled }}
      # emptyDir (the default) happens to come out writable by whatever
      # UID a container runs as on most container runtimes, so this was
      # never needed for the vast.ai/fragmentation and heterogeneous-SKU
      # tests. A real dynamically-provisioned volume (GKE's PD CSI driver,
      # and cloud block storage generally) mounts owned by root with
      # restrictive permissions instead -- without fsGroup telling
      # Kubernetes to chown the volume to a group all five containers'
      # distinct non-root UIDs (10001-10005 below) belong to, every one of
      # them fails at startup with "unable to open database file". Found
      # live testing on a real GKE cluster with persistence.enabled=true
      # for the first time.
      securityContext:
        fsGroup: 10000
      {{- end }}
      containers:
        - name: telemetry-collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-config
            {{- if .Values.alerting.webhookUrl }}
            - secretRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-alert-webhook
            {{- end }}
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          # run_forever catches every exception from a scrape cycle and
          # keeps looping (see collector.py) -- the process itself never
          # crashes on a bad cycle, so a plain "is the process alive"
          # check can't catch a genuinely stuck loop. This checks that
          # /data/.heartbeat (touched at the end of every iteration,
          # success or failure) is still fresh instead.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  now=$(date +%s)
                  hb=$(stat -c %Y /data/.heartbeat 2>/dev/null || echo 0)
                  [ $((now - hb)) -lt {{ mul .Values.collector.scrapeIntervalSeconds 4 | add 60 }} ]
            initialDelaySeconds: {{ add .Values.collector.scrapeIntervalSeconds 30 }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # subPath "raw" isolates the collector's own database from the
            # "normalized" subdirectory the ingestion sidecar writes into,
            # while both still live on the one PVC below.
            - name: data
              mountPath: /data
              subPath: raw
        {{- if .Values.ingestion.enabled }}
        - name: ingestion-normalization
          image: "{{ .Values.ingestion.image.repository }}:{{ .Values.ingestion.image.tag }}"
          imagePullPolicy: {{ .Values.ingestion.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-config
            {{- if .Values.alerting.webhookUrl }}
            - secretRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-alert-webhook
            {{- end }}
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
          # See the telemetry-collector container's livenessProbe comment
          # above -- same reasoning, checking this component's own
          # heartbeat file instead.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  now=$(date +%s)
                  hb=$(stat -c %Y /data/normalized/.heartbeat 2>/dev/null || echo 0)
                  [ $((now - hb)) -lt {{ mul .Values.ingestion.pollIntervalSeconds 4 | add 60 }} ]
            initialDelaySeconds: {{ add .Values.ingestion.pollIntervalSeconds 30 }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Read-only: this component must never be able to write into
            # the collector's raw data, even by accident (see
            # ingestion-normalization/src/ingestion_normalization/raw_reader.py,
            # which additionally opens its sqlite connection in mode=ro).
            - name: data
              mountPath: /data/raw
              subPath: raw
              readOnly: true
            - name: data
              mountPath: /data/normalized
              subPath: normalized
        {{- end }}
        {{- if .Values.wasteDetector.enabled }}
        - name: waste-detector
          image: "{{ .Values.wasteDetector.image.repository }}:{{ .Values.wasteDetector.image.tag }}"
          imagePullPolicy: {{ .Values.wasteDetector.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-config
            {{- if .Values.alerting.webhookUrl }}
            - secretRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-alert-webhook
            {{- end }}
          resources:
            {{- toYaml .Values.wasteDetector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10003
          # See the telemetry-collector container's livenessProbe comment
          # above -- same reasoning, checking this component's own
          # heartbeat file instead.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  now=$(date +%s)
                  hb=$(stat -c %Y /data/findings/.heartbeat 2>/dev/null || echo 0)
                  [ $((now - hb)) -lt {{ mul .Values.wasteDetector.pollIntervalSeconds 4 | add 60 }} ]
            initialDelaySeconds: {{ add .Values.wasteDetector.pollIntervalSeconds 30 }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Read-only for the same reason as ingestion's mount above --
            # this component must never be able to write into
            # ingestion-normalization's output (see
            # waste-detector/src/waste_detector/rollup_reader.py, which
            # also opens its sqlite connection in mode=ro).
            - name: data
              mountPath: /data/normalized
              subPath: normalized
              readOnly: true
            - name: data
              mountPath: /data/findings
              subPath: findings
        {{- end }}
        {{- if .Values.savingsEstimator.enabled }}
        - name: savings-estimator
          image: "{{ .Values.savingsEstimator.image.repository }}:{{ .Values.savingsEstimator.image.tag }}"
          imagePullPolicy: {{ .Values.savingsEstimator.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-config
            {{- if .Values.alerting.webhookUrl }}
            - secretRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-alert-webhook
            {{- end }}
          resources:
            {{- toYaml .Values.savingsEstimator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10004
          # See the telemetry-collector container's livenessProbe comment
          # above -- same reasoning, checking this component's own
          # heartbeat file instead.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  now=$(date +%s)
                  hb=$(stat -c %Y /data/savings/.heartbeat 2>/dev/null || echo 0)
                  [ $((now - hb)) -lt {{ mul .Values.savingsEstimator.pollIntervalSeconds 4 | add 60 }} ]
            initialDelaySeconds: {{ add .Values.savingsEstimator.pollIntervalSeconds 30 }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Read-only against both upstream outputs it prices findings
            # from -- same reasoning as every read-only mount above (see
            # savings-estimator's findings_reader.py / rollup_reader.py,
            # both opened in mode=ro).
            - name: data
              mountPath: /data/findings
              subPath: findings
              readOnly: true
            - name: data
              mountPath: /data/normalized
              subPath: normalized
              readOnly: true
            - name: data
              mountPath: /data/savings
              subPath: savings
        {{- end }}
        {{- if .Values.dashboard.enabled }}
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-config
            {{- if .Values.alerting.webhookUrl }}
            - secretRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-alert-webhook
            {{- end }}
            - secretRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-dashboard-auth
          env:
            # dashboard's own code default ("./report.html") is fine for
            # local/dev use outside a container, but readOnlyRootFilesystem
            # here means only the dashboard-tmp emptyDir below (/tmp) is
            # actually writable -- without this, `generate-report` (the
            # chart's own install NOTES document it as a supported command)
            # fails immediately with "Read-only file system", found live
            # testing.
            - name: REPORT_OUTPUT_PATH
              value: /tmp/report.html
          ports:
            - name: dashboard
              containerPort: {{ .Values.dashboard.port }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10005
          # /healthz (see server.py) is deliberately unauthenticated and
          # returns no report data -- a liveness/readiness probe can't
          # carry the bearer token, and shouldn't need to.
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.dashboard.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.dashboard.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Read-only: the dashboard only ever reads savings-estimator's
            # output (see dashboard's report_reader.py, opened in mode=ro).
            - name: data
              mountPath: /data/savings
              subPath: savings
              readOnly: true
            # readOnlyRootFilesystem: true above blocks writes everywhere
            # else in this container -- without this, the `generate-report`
            # CLI this chart's own install NOTES document as a supported
            # feature ("generate a standalone HTML file to share") fails
            # immediately with "Read-only file system" the moment it's
            # actually run, found live testing: it has no writable path to
            # write to anywhere in the pod. This is the one place it needs
            # write access, kept as small/separate as possible rather than
            # loosening readOnlyRootFilesystem itself.
            - name: dashboard-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "gpu-telemetry-collector.fullname" . }}-collector-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.dashboard.enabled }}
        - name: dashboard-tmp
          emptyDir: {}
        {{- end }}
