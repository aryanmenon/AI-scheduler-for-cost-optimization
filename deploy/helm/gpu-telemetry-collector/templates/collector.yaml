apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-config
  labels:
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
data:
  DCGM_EXPORTER_URL: "http://{{ include "gpu-telemetry-collector.fullname" . }}-dcgm-exporter:9400/metrics"
  KUBE_STATE_METRICS_URL: "http://{{ include "gpu-telemetry-collector.fullname" . }}-kube-state-metrics:8080/metrics"
  TELEMETRY_SQLITE_PATH: "/data/telemetry.db"
  SCRAPE_INTERVAL_SECONDS: {{ .Values.collector.scrapeIntervalSeconds | quote }}
  HTTP_TIMEOUT_SECONDS: {{ .Values.collector.httpTimeoutSeconds | quote }}
  MAX_SCRAPE_RETRIES: {{ .Values.collector.maxScrapeRetries | quote }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-data
  labels:
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-telemetry-collector.fullname" . }}-collector
  labels:
    app.kubernetes.io/name: telemetry-collector
    {{- include "gpu-telemetry-collector.labels" . | nindent 4 }}
spec:
  # Exactly one replica: it's a single writer to one SQLite file, and a
  # second replica would double-count every scrape.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "gpu-telemetry-collector.fullname" . }}-collector
      containers:
        - name: telemetry-collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gpu-telemetry-collector.fullname" . }}-collector-config
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "gpu-telemetry-collector.fullname" . }}-collector-data
          {{- else }}
          emptyDir: {}
          {{- end }}
