[project]
name = "waste-detector"
version = "0.1.0"
description = "Detects idle, over-provisioned, and fragmented GPU capacity from normalized telemetry rollups (Phase 1, Component 3)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
waste-detector = "waste_detector.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
