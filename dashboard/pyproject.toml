[project]
name = "dashboard"
version = "0.1.0"
description = "Observe-mode report and live dashboard rendering savings-estimator's findings -- the self-serve sales artifact (Phase 1, Component 5)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
dashboard-server = "dashboard.main:main"
generate-report = "dashboard.main:generate_report_cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
