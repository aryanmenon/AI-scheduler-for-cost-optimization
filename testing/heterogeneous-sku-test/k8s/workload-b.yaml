# Twin of workload-a.yaml, pinned to node B (the second, different GPU
# type) instead. Replace NODE_B_NAME below with the real value from
# `kubectl get nodes` (see README step 3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-model-b
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiny-model-b
  template:
    metadata:
      labels:
        app: tiny-model-b
    spec:
      nodeSelector:
        kubernetes.io/hostname: NODE_B_NAME
      containers:
        - name: server
          image: tiny-model-server:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tiny-model-b
  namespace: inference
spec:
  selector:
    app: tiny-model-b
  ports:
    - port: 8000
      targetPort: 8000
