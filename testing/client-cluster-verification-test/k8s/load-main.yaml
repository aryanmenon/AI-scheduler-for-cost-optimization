# Real Azure LLM conversation trace, looped, against vllm-main. Runs in the
# cluster (not via port-forward, which drops under load). Edit __HOURS__
# with sed when applying -- see the README.
apiVersion: batch/v1
kind: Job
metadata:
  name: load-main
  namespace: client-sim
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: python:3.11-slim
          command: ["python3", "-u", "/scripts/trace_load.py",
                    "--target", "http://vllm-main:8000", "--model", "main",
                    "--trace", "conv", "--speed", "1.0",
                    "--duration-hours", "__HOURS__", "--label", "phase1-main-a100"]
          volumeMounts: [{name: scripts, mountPath: /scripts}]
      volumes:
        - name: scripts
          configMap: {name: client-sim-scripts}
