# Twin of workload-a.yaml under a distinct name -- see that file's
# comment for why fragmentation testing needs both.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-model-b
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiny-model-b
  template:
    metadata:
      labels:
        app: tiny-model-b
    spec:
      containers:
        - name: server
          image: tiny-model-server:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tiny-model-b
  namespace: inference
spec:
  selector:
    app: tiny-model-b
  ports:
    - port: 8000
      targetPort: 8000
