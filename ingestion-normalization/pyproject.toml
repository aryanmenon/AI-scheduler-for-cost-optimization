[project]
name = "ingestion-normalization"
version = "0.1.0"
description = "Normalizes raw GPU telemetry into per-workload time series, comparable across heterogeneous SKUs (Phase 1, Component 2)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ingestion-normalization = "ingestion_normalization.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
