name: CI

# No CI existed at all before this: the 238+ tests across all six
# components only ran when a human remembered to run pytest locally.
# This runs them on every push and pull request instead.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all components editable (with dev extras)
        # Each component declares "dependencies = []" and cross-imports
        # its neighbors at runtime, not via declared package dependencies
        # (see savings-estimator/README.md) -- so a single editable
        # install of all six in one invocation is enough, order doesn't
        # matter for resolution. `python -m pip`, not bare `pip`, so this
        # is unambiguously the interpreter actions/setup-python just set
        # up, not whatever `pip` happens to resolve to on PATH.
        run: |
          python -m pip install \
            -e "telemetry-collector[dev]" \
            -e "ingestion-normalization[dev]" \
            -e "waste-detector[dev]" \
            -e "savings-estimator[dev]" \
            -e "dashboard[dev]" \
            -e "integration-tests[dev]"

      # `python -m pytest`, not bare `pytest`, for the same reason as
      # above -- confirmed locally that a bare `pytest` on PATH can
      # silently resolve to an unrelated, isolated pytest install that
      # can't see any of the editable installs above at all.
      - name: Test telemetry-collector
        run: cd telemetry-collector && python -m pytest

      - name: Test ingestion-normalization
        run: cd ingestion-normalization && python -m pytest

      - name: Test waste-detector
        run: cd waste-detector && python -m pytest

      - name: Test savings-estimator
        run: cd savings-estimator && python -m pytest

      - name: Test dashboard
        run: cd dashboard && python -m pytest

      - name: Test full-pipeline integration
        run: cd integration-tests && python -m pytest

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint deploy/helm/gpu-telemetry-collector

      - name: helm template (verify it renders without error)
        # No live cluster here, so the auth-secret template's `lookup`
        # call returns empty and falls through to generating a token --
        # this only proves the chart renders valid-shaped YAML, not that
        # it deploys cleanly (that needs a real cluster, intentionally
        # out of scope for this check).
        run: helm template test-release deploy/helm/gpu-telemetry-collector > /dev/null

  docker-build:
    # Each Dockerfile is referenced by the Helm chart's values.yaml as the
    # image every sidecar actually runs -- an untested Dockerfile is an
    # untested deployment. savings-estimator is the odd one out: it needs
    # its two sibling packages copied in (see its Dockerfile's own
    # comment), so it alone builds from the repo root.
    #
    # Every push builds (a broken Dockerfile on a feature branch should
    # fail loudly), but only a push to the repo's default branch also
    # publishes -- a PR or feature branch has no business landing images
    # in the registry the Helm chart's values.yaml actually points at.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: telemetry-collector
            context: telemetry-collector
            dockerfile: telemetry-collector/Dockerfile
          - component: ingestion-normalization
            context: ingestion-normalization
            dockerfile: ingestion-normalization/Dockerfile
          - component: waste-detector
            context: waste-detector
            dockerfile: waste-detector/Dockerfile
          - component: savings-estimator
            context: .
            dockerfile: savings-estimator/Dockerfile
          - component: dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Determine whether to publish
        id: publish
        # Only a push (not pull_request) to the repository's own default
        # branch publishes. github.event.repository.default_branch is used
        # instead of a hardcoded branch name since this repo's default
        # branch isn't literally "main".
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image name
        id: image
        # GHCR requires an all-lowercase path; github.repository preserves
        # this repo's actual (mixed-case) casing, so it's lowercased here
        # rather than assumed.
        run: |
          echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish on the default branch) ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.component }}:latest
            ${{ steps.image.outputs.prefix }}/${{ matrix.component }}:${{ github.sha }}

  dependency-audit:
    # Scans the pinned runtime dependency versions (requests,
    # prometheus-client, pytest, etc. -- see each component's
    # pyproject.toml) for known CVEs. Installs the same way the `test` job
    # does so pip-audit sees exactly what's actually pinned, not a fresh
    # unconstrained resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all components editable (with dev extras)
        run: |
          python -m pip install \
            -e "telemetry-collector[dev]" \
            -e "ingestion-normalization[dev]" \
            -e "waste-detector[dev]" \
            -e "savings-estimator[dev]" \
            -e "dashboard[dev]" \
            -e "integration-tests[dev]"

      - name: Install pip-audit
        # Upgrade pip/setuptools first: confirmed locally that
        # actions/setup-python's bundled pip 24.0 and setuptools 79.0.1
        # carry their own known CVEs (PYSEC-2026-*), unrelated to anything
        # this repo depends on -- auditing before upgrading them would
        # fail this job on bootstrap tooling, not on our actual
        # dependency choices.
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install pip-audit

      - name: Audit installed dependencies for known CVEs
        # `python -m pip_audit` (the importable module name has an
        # underscore; the CLI entry point has a hyphen -- confirmed
        # locally that `python -m pip-audit` fails with "No module named
        # pip-audit"). --local restricts the scan to packages actually
        # installed in this environment (the pinned versions above), not
        # the full PyPI index; the six -e installs of the components
        # themselves aren't PyPI-published so pip-audit skips them and
        # audits their third-party dependencies instead.
        run: python -m pip_audit --local
