name: CI

# No CI existed at all before this: the 238+ tests across all six
# components only ran when a human remembered to run pytest locally.
# This runs them on every push and pull request instead.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all components editable (with dev extras)
        # Each component declares "dependencies = []" and cross-imports
        # its neighbors at runtime, not via declared package dependencies
        # (see savings-estimator/README.md) -- so a single editable
        # install of all six in one invocation is enough, order doesn't
        # matter for resolution. `python -m pip`, not bare `pip`, so this
        # is unambiguously the interpreter actions/setup-python just set
        # up, not whatever `pip` happens to resolve to on PATH.
        run: |
          python -m pip install \
            -e "telemetry-collector[dev]" \
            -e "ingestion-normalization[dev]" \
            -e "waste-detector[dev]" \
            -e "savings-estimator[dev]" \
            -e "dashboard[dev]" \
            -e "integration-tests[dev]"

      # `python -m pytest`, not bare `pytest`, for the same reason as
      # above -- confirmed locally that a bare `pytest` on PATH can
      # silently resolve to an unrelated, isolated pytest install that
      # can't see any of the editable installs above at all.
      - name: Test telemetry-collector
        run: cd telemetry-collector && python -m pytest

      - name: Test ingestion-normalization
        run: cd ingestion-normalization && python -m pytest

      - name: Test waste-detector
        run: cd waste-detector && python -m pytest

      - name: Test savings-estimator
        run: cd savings-estimator && python -m pytest

      - name: Test dashboard
        run: cd dashboard && python -m pytest

      - name: Test full-pipeline integration
        run: cd integration-tests && python -m pytest

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint deploy/helm/gpu-telemetry-collector

      - name: helm template (verify it renders without error)
        # No live cluster here, so the auth-secret template's `lookup`
        # call returns empty and falls through to generating a token --
        # this only proves the chart renders valid-shaped YAML, not that
        # it deploys cleanly (that needs a real cluster, intentionally
        # out of scope for this check).
        run: helm template test-release deploy/helm/gpu-telemetry-collector > /dev/null
