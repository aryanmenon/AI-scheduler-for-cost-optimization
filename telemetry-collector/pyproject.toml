[project]
name = "telemetry-collector"
version = "0.1.0"
description = "Read-only GPU telemetry collector for the cost-optimization SaaS (Phase 1, Component 1)"
requires-python = ">=3.10"
dependencies = [
    "requests==2.33.1",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
telemetry-collector = "telemetry_collector.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
